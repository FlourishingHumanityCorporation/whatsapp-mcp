# Auto-generated by sync-pre-commit-configs. Do not edit manually.
# Override registry: .meta/pre-commit-overrides.json
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages:
          - pre-commit
        exclude: (^|/)evals/(data|results)/
      - id: end-of-file-fixer
        stages:
          - pre-commit
        exclude: (^|/)evals/(data|results)/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
        stages:
          - pre-commit
        exclude: (^|/)evals/(data|results)/
      - id: check-case-conflict
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: test-policy-changed-files
        name: test policy changed-file guard
        entry: bash -c 'exec python3 "$HOME/CodeProjects/.meta/scripts/test-policy-changed-files" "$@"' --
        language: system
        files: (^|/)(tests/.*\.py|conftest\.py|test_.*\.py|appcheck\.toml|projects\.json|Makefile|package\.json)$
        pass_filenames: true
        require_serial: true
      - id: pyright
        name: Python syntax compile
        entry: bash -c 'exec $HOME/CodeProjects/.meta/hooks/run-in-candidate-checkout python3 -c 'from pathlib import Path; [compile(p.read_text(), str(p), "exec") for p in sorted(Path("whatsapp-mcp-server").glob("*.py"))]''
        language: system
        files: ^whatsapp-mcp-server/.*\.py$
        types:
          - python
        pass_filenames: false
        require_serial: true
      - id: silent-degradation-gate
        name: silent-degradation gate (no new HIGH)
        entry: bash -c 'exec $HOME/CodeProjects/.meta/hooks/run-in-candidate-checkout $HOME/CodeProjects/tools/code-hygiene/.venv/bin/code-hygiene audit silent-degradation --path . --gate --repo-only'
        language: system
        files: \.py$
        pass_filenames: false
        require_serial: true
      - id: go-package-compile
        name: Go package compile
        entry: bash -c 'cd whatsapp-bridge && go test ./...'
        language: system
        files: ^whatsapp-bridge/.*\.go$
        pass_filenames: false
      - id: architecture-check
        name: architecture module boundary gate (whatsapp-mcp)
        entry: make architecture-check
        language: system
        files: ^(?:(?:\.pre-commit-config\.yaml|AGENTS\.md|CLAUDE\.md|Makefile|appcheck\.toml|pyproject\.toml|\.appcheck/architecture-baseline\.json|docs/architecture/ARCHITECTURE\.md|whatsapp-bridge|whatsapp-mcp-server|tests|infra|docs|\.appcheck/projects\.json|\.claudeignore|\.gitignore|LICENSE|README\.md|REBUILD\.md|automations\.toml|example-use\.png|\.appcheck|docs/architecture)$|(?:whatsapp-bridge/|whatsapp-mcp-server/|tests/|infra/|docs/)|(?:[^/]+)$)
        pass_filenames: false
        require_serial: true
        stages:
          - pre-commit
          - pre-push
