[app]
name = "whatsapp-mcp"
type = "tool"
required_checks = ["architecture"]

[architecture]
enabled = true
required = true
source_roots = ["whatsapp-bridge", "whatsapp-mcp-server", "tests"]
resource_roots = ["infra", "docs"]
resource_files = [
    ".appcheck/architecture-baseline.json",
    ".appcheck/projects.json",
    ".claudeignore",
    ".gitignore",
    ".pre-commit-config.yaml",
    "AGENTS.md",
    "CLAUDE.md",
    "LICENSE",
    "Makefile",
    "README.md",
    "REBUILD.md",
    "appcheck.toml",
    "automations.toml",
    "example-use.png",
]
max_root_files = 8
script_roots = []
entry_points = []
script_max_lines = 500
baseline_file = ".appcheck/architecture-baseline.json"
composition_roots = [
    "whatsapp-bridge/main.go",
    "whatsapp-mcp-server/main.py",
]

[[architecture.modules]]
name = "bridge_composition"
paths = ["whatsapp-bridge/main.go"]
may_depend_on = ["bridge_session"]

[[architecture.modules]]
name = "bridge_session"
paths = ["whatsapp-bridge/bridge/bridge.go"]
may_depend_on = [
    "bridge_history",
    "bridge_messaging",
    "bridge_rest",
    "bridge_store",
]

[[architecture.modules]]
name = "bridge_history"
paths = ["whatsapp-bridge/bridge/history.go"]
may_depend_on = ["bridge_messaging", "bridge_naming", "bridge_store"]

[[architecture.modules]]
name = "bridge_naming"
paths = ["whatsapp-bridge/bridge/naming.go"]
may_depend_on = ["bridge_store"]

[[architecture.modules]]
name = "bridge_store"
paths = ["whatsapp-bridge/bridge/store.go"]
may_depend_on = []

[[architecture.modules]]
name = "bridge_messaging"
paths = ["whatsapp-bridge/bridge/messaging.go"]
may_depend_on = ["bridge_audio_analysis", "bridge_naming", "bridge_store"]

[[architecture.modules]]
name = "bridge_media"
paths = ["whatsapp-bridge/bridge/media.go"]
may_depend_on = ["bridge_store"]

[[architecture.modules]]
name = "bridge_rest"
paths = ["whatsapp-bridge/bridge/rest.go"]
may_depend_on = ["bridge_media", "bridge_messaging", "bridge_store"]

[[architecture.modules]]
name = "bridge_audio_analysis"
paths = ["whatsapp-bridge/bridge/audio_analysis.go"]
may_depend_on = []

[[architecture.modules]]
name = "bridge_test_consumers"
paths = ["whatsapp-bridge/bridge/*_test.go"]
may_depend_on = [
    "bridge_audio_analysis",
    "bridge_media",
    "bridge_messaging",
]

[[architecture.modules]]
name = "bridge_build"
paths = ["whatsapp-bridge/go.mod", "whatsapp-bridge/go.sum"]
may_depend_on = []

[[architecture.modules]]
name = "server_audio"
paths = ["whatsapp-mcp-server/audio.py"]
may_depend_on = []

[[architecture.modules]]
name = "server_access"
paths = ["whatsapp-mcp-server/whatsapp.py"]
may_depend_on = ["server_audio"]

[[architecture.modules]]
name = "server_delivery"
paths = ["whatsapp-mcp-server/main.py", "whatsapp-mcp-server/tools.py"]
may_depend_on = ["server_access"]

[[architecture.modules]]
name = "server_build"
paths = [
    "whatsapp-mcp-server/.gitignore",
    "whatsapp-mcp-server/.python-version",
    "whatsapp-mcp-server/pyproject.toml",
    "whatsapp-mcp-server/uv.lock",
]
may_depend_on = []

[[architecture.modules]]
name = "test_consumers"
paths = ["tests/**"]
may_depend_on = []

[[architecture.modules]]
name = "service_control"
paths = ["infra/**", "automations.toml"]
may_depend_on = ["server_delivery"]

[[architecture.modules]]
name = "project_knowledge"
paths = [
    "docs/**",
    "LICENSE",
    "README.md",
    "REBUILD.md",
    "example-use.png",
]
may_depend_on = []

[[architecture.modules]]
name = "agent_control"
paths = ["AGENTS.md", "CLAUDE.md"]
may_depend_on = []

[[architecture.modules]]
name = "build_control"
paths = [
    ".appcheck/architecture-baseline.json",
    ".appcheck/projects.json",
    ".claudeignore",
    ".gitignore",
    ".pre-commit-config.yaml",
    "Makefile",
    "appcheck.toml",
]
may_depend_on = []

[env]
required = []
optional = []

[loc]
max_lines = 1500
extensions = [".py", ".go"]

[docs]
enabled = false

[testing]
service_markers = ["live_whatsapp", "whatsapp_bridge", "personal_messages", "message_send", "media_download", "sqlite", "filesystem"]
xfail_require_strict = true

[standards]
definitions_path = "/Users/paulrohde/CodeProjects/docs/standards"

[compat]
enabled = true
scan_deprecated_usage = true

[[custom_checks]]
name = "check"
command = "make check"
description = "WhatsApp MCP syntax and Go package compilation pass without starting the bridge, MCP server, WhatsApp connection, or message-store reads"
timeout = 180
fail_on_stderr = true

[[conventions.exemptions]]
family = "observability-routing"
status = "not-applicable"
source = "appcheck.toml"
reason = "Operator-invoked tool with no repo-owned scheduled process or proactive background degradation surface; failures return directly to the invoking operator."

# STD-015: minimum function baseline derived from the approved 2026-07-09
# registry evidence review. Expand during quarterly function-fit review.
[functions]
enabled = true

[[functions.items]]
id = "F1"
statement = "ensure that MCP clients can search, read, and explicitly send WhatsApp messages through the local bridge"
consumers = ["operator"]
kind = "service"
liveness = "manual"
